<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR - CITI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #1a2a5e;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #1a2a5e;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-download {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .qr-container {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: #f9f9f9;
            border-radius: 12px;
            display: none;
        }

        .qr-container.active {
            display: block;
        }

        #qrcode {
            display: inline-block;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .info-text {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #1565c0;
            margin-bottom: 20px;
        }

        .info-text strong {
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            #qrcode {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Generador QR - CITI</h1>
        <p class="subtitle">Crea tu código QR personalizado</p>

        <div class="info-text">
            <strong>ℹ️ Instrucciones:</strong>
            Pega la URL de tu página QR (GitHub Pages) abajo y genera el código QR para descargar.
        </div>

        <div class="input-group">
            <label for="urlInput">URL de la página (GitHub Pages):</label>
            <input 
                type="url" 
                id="urlInput" 
                placeholder="Ej: https://tuusuario.github.io/CITI-Construccion-qr-menu/citi_qr_menu.html"
                value="https://dvd0001.github.io/CITI-Construccion-qr-menu/citi_qr_menu.html"
            >
        </div>

        <div class="button-group">
            <button class="btn-generate" onclick="generarQR()">📱 Generar QR</button>
            <button class="btn-download" id="downloadBtn" onclick="descargarQR()" disabled>⬇️ Descargar</button>
        </div>

        <div class="qr-container" id="qrContainer">
            <div id="qrcode"></div>
            <p style="margin-top: 15px; color: #666; font-size: 12px;">
                Haz clic en "Descargar" para guardar tu código QR
            </p>
        </div>
    </div>

    <script>
        let generadorQR = null;

        function generarQR() {
            const url = document.getElementById('urlInput').value.trim();

            if (!url) {
                alert('⚠️ Por favor ingresa una URL válida');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('⚠️ La URL debe comenzar con http:// o https://');
                return;
            }

            // Limpiar QR anterior
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';

            // Generar nuevo QR
            generadorQR = new QRCode(qrcodeDiv, {
                text: url,
                width: 300,
                height: 300,
                colorDark: '#1a2a5e',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            // Mostrar contenedor
            document.getElementById('qrContainer').classList.add('active');

            // Habilitar botón descargar
            document.getElementById('downloadBtn').disabled = false;
        }

        function descargarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            
            if (!canvas) {
                alert('⚠️ Primero genera el código QR');
                return;
            }

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'codigo_qr_citi.png';
            link.click();
        }

        // Permitir generar con Enter
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generarQR();
            }
        });

        // Generar automáticamente al cargar
        window.addEventListener('load', function() {
            generarQR();
        });
    </script>
</body>
</html>
